specVersion: "4.0"
metadata:
  name: artech.capacitacion.fiori
type: application
framework:
  name: OpenUI5
  version: "1.143.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-livereload
      afterMiddleware: compression
      configuration:
        debug: true
        extraExts: "xml,json,properties"
        path: webapp
